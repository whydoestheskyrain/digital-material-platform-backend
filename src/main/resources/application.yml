server:
  port: 8081
  address: 0.0.0.0

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/trade_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: <your-mysql-password>
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
  redis:
    host: localhost
    port: 6379
    password:
    database: 0
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.trade.virtual_trade.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    org.springframework.web.servlet.resource: ERROR

# 支付宝沙箱 最终终极正确配置
alipay:
  gateway-url: https://openapi-sandbox.dl.alipaydev.com/gateway.do
  app-id: 9021000163688665
  # 👇 这是你【JAVA语言】的私钥，一行，无任何头尾
  app-private-key: "<your-alipay-private-key>"
  # 👇 这是你【支付宝公钥】
  public-key: "<your-alipay-public-key>"
  charset: UTF-8
  format: json
  sign-type: RSA2
  return-url: http://localhost:8082/#/user/center
  notify-url: http://<your-cpolar-host>/alipay/notify
  recharge-notify-url: http://<your-cpolar-host>/recharge/notify
file:
  upload:
    path: ./uploads/

dashscope:
  api-key: <your-dashscope-api-key>
  app-id: <your-dashscope-app-id>